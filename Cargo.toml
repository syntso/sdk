[package]
name = "synt-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Rust SDK for Synt extensions"
repository = "https://github.com/syntso/sdk"
publish = false

[dependencies]
data-encoding = "2.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "realloc", "std"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async_trait_impl = "allow"
